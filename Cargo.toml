[package]
name = "ebb"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
clap-markdown = "0.1.5"
clap_complete = "4.6.9"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1"
tabled = "0.21.0"
tempfile = "3"
toml = "1.1.4"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
assert_cmd = "2"
predicates = "3.1.4"
