# Runs on every pull request, so it can be a required status check.

name: LLM attribution

on:
  pull_request:

permissions: {}

jobs:
  llm-attribution:
    name: LLM attribution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # to list the commits of the pull request
      pull-requests: read
    steps:
      - uses: woylie/llm-attribution@ff085b341b97d4c4dd274fb0f374818f7ce30cbc # 1.0.0
