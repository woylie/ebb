name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach binaries to, e.g. v0.3.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # renovate: datasource=github-releases depName=rust-lang/rust
  RUST_VERSION: "1.99.0"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15 }
          - { target: aarch64-apple-darwin, os: macos-15 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
          rustup default "$RUST_VERSION"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target "$TARGET"
        env:
          TARGET: ${{ matrix.target }}

      - name: Package
        run: |
          name="ebb-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/ebb" README.md LICENSE THIRD_PARTY "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
        env:
          TARGET: ${{ matrix.target }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ebb-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  upload:
    name: Upload
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # to upload the release assets
      contents: write
      # to sign the provenance attestations
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ebb-*
          path: dist
          merge-multiple: true

      - name: Write checksums
        working-directory: dist
        run: sha256sum ./*.tar.gz > SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # without --clobber, so an asset that already exists is never replaced
      - name: Upload to the release
        run: gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
